# Kernel + DAG-evaluator tests and the wasm build.
#
# The kernel workspace is dependency-free; the DAG evaluator's fixture corpus
# is vendored in-crate, so everything here runs hermetically.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast structural checks — no Rust toolchain, fails in seconds: marker /
  # parity hygiene, zero-dep kernel, leakage deny-list, filename lint,
  # src↔lib.rs module bijection, tests layout (see parity/guardrails.py).
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural guardrails + marker hygiene
        run: python3 parity/guardrails.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Kernel + DAG tests
        run: cargo test --workspace --lib --tests
      - name: Kernel is dependency-free (belt and braces)
        run: |
          deps=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(len(p['dependencies']) for p in d['packages'] if p['name']=='ironstream'))")
          test "$deps" = "0" || { echo "ironstream has $deps dependencies"; exit 1; }

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ironstream-wasm
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build ironstream-wasm
        working-directory: crates/ironstream-wasm
        run: wasm-pack build --target web --release
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironstream-wasm-pkg
          path: |
            crates/ironstream-wasm/pkg/ironstream_wasm.js
            crates/ironstream-wasm/pkg/ironstream_wasm.d.ts
            crates/ironstream-wasm/pkg/ironstream_wasm_bg.wasm
