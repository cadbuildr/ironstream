# Build tuning for the IronStream workspace.
#
# The `ironstream` crate is a ~6,900-module rlib; the ported OCCT test corpus
# is consolidated into ONE integration-test binary (tests/occt_suite/, see
# parity/gen_occt_suite.py) that statically links the full kernel. Compiling
# the rlib and that one large link with unbounded parallelism exhausts memory
# on a dev laptop.
#
# Two mitigations here:
#   * cap concurrent codegen/link jobs so peak memory stays bounded;
#   * the canonical fast loop is `cargo test -p ironstream --lib`, which runs the
#     inline #[cfg(test)] unit tests and never builds the integration-test
#     binary at all.
[build]
jobs = 6
incremental = true
